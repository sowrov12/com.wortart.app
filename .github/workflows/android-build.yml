name: Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests and debug APK
        id: build
        shell: bash
        run: gradle testDebugUnitTest assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      - name: Write build summary
        if: always()
        run: python3 .github/scripts/summarize.py build build.log "${{ steps.build.outcome }}"

      - name: Android Lint
        id: lint
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: gradle lintDebug --console=plain 2>&1 | tee lint.log

      - name: Write lint summary
        if: steps.build.outcome == 'success'
        run: python3 .github/scripts/summarize.py lint lint.log "${{ steps.lint.outcome }}"

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: WortArt-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            lint.log
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
